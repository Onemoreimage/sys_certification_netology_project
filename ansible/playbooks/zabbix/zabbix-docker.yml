---
- name: Install Docker and Docker Compose
  hosts: zabbix
  become: true
  tasks:
    - name: Remove old Docker packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Get Debian package architecture
      ansible.builtin.command: dpkg --print-architecture
      register: docker_apt_arch
      changed_when: false

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_arch.stdout }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker CE packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is started and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

- name: Deploy Zabbix via Docker Compose
  hosts: zabbix
  become: true
  tasks:
    - name: Create project directory
      ansible.builtin.file:
        path: /opt/zabbix-docker
        state: directory
        mode: '0755'

    - name: Create .env file
      ansible.builtin.copy:
        dest: /opt/zabbix-docker/.env
        mode: '0600'
        content: |
          POSTGRES_USER=zabbix
          POSTGRES_PASSWORD=zabbix_pwd
          POSTGRES_DB=zabbix
          ZBX_SERVER_HOST=zabbix-server-pgsql
          ZBX_SERVER_NAME=Zabbix server
          DB_SERVER_HOST=postgres-server
          DB_SERVER_PORT=5432
          DB_SERVER_USER=zabbix
          DB_SERVER_PASSWORD=zabbix_pwd
          DB_SERVER_NAME=zabbix

    - name: Create docker-compose.yml
      ansible.builtin.copy:
        dest: /opt/zabbix-docker/docker-compose.yml
        mode: '0644'
        content: |
          version: '3.8'
          services:
            postgres-server:
              image: postgres:15-alpine
              restart: unless-stopped
              environment:
                - POSTGRES_USER=${POSTGRES_USER}
                - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                - POSTGRES_DB=${POSTGRES_DB}
              volumes:
                - pgdata:/var/lib/postgresql/data
              networks:
                - zabbix-net

            zabbix-server:
              image: zabbix/zabbix-server-pgsql:ubuntu-latest
              restart: unless-stopped
              environment:
                - DB_SERVER_HOST=${DB_SERVER_HOST}
                - DB_SERVER_PORT=${DB_SERVER_PORT}
                - POSTGRES_USER=${POSTGRES_USER}
                - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                - POSTGRES_DB=${POSTGRES_DB}
              depends_on:
                - postgres-server
              ports:
                - "10051:10051"
              networks:
                - zabbix-net

            zabbix-web-nginx-pgsql:
              image: zabbix/zabbix-web-nginx-pgsql:ubuntu-latest
              restart: unless-stopped
              environment:
                - ZBX_SERVER_HOST=${ZBX_SERVER_HOST}
                - DB_SERVER_HOST=${DB_SERVER_HOST}
                - DB_SERVER_PORT=${DB_SERVER_PORT}
                - POSTGRES_USER=${POSTGRES_USER}
                - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                - POSTGRES_DB=${POSTGRES_DB}
                - PHP_TZ=Europe/Moscow
              depends_on:
                - postgres-server
                - zabbix-server
              ports:
                - "80:8080"
              networks:
                - zabbix-net


            zabbix-agent:
              image: zabbix/zabbix-agent2:ubuntu-latest
              container_name: zabbix-agent
              restart: unless-stopped
              environment:
                - ZBX_HOSTNAME=Zabbix server
                - ZBX_SERVER_HOST=zabbix-server
                - ZBX_SERVER_PORT=10051
                - ZBX_ACTIVE_ALLOW=true
                - ZBX_PASSIVE_ALLOW=true
              ports:
                - "10050:10050"
              networks:
                - zabbix-net

          volumes:
            pgdata:

          networks:
            zabbix-net:
              driver: bridge

    - name: Run docker compose up
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/zabbix-docker
      register: compose_result
      changed_when: compose_result.rc == 0

    - name: Show compose output
      ansible.builtin.debug:
        var: compose_result.stdout_lines
